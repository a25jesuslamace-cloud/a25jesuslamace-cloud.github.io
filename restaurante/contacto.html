<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Jesus Lama">
    <meta name="description" content="Formulario de contacto.">
    <meta name="keywords" content="contacto, mensaje, restaurante">
    <title>Envíenos su mensaje - Restaurante Sabor Tradicional</title>
</head>
<body>

<header>
    <h1>Restaurante Sabor Tradicional</h1>
</header>

<nav>
    <ul>
        <li><a href="index.html">Volver al Menú Principal del Restaurante</a></li>
        <li><a href="../index.html">Volver al Menú Principal del Proyecto</a></li>
    </ul>
</nav>

<main>
    <section>
        <h2>Envíenos su mensaje</h2>
        
        <form action="#" method="get">
            <p>Su nombre: <br><input type="text" name="nombre" placeholder="Su nombre"></p>
            <p>Su correo electrónico: <br><input type="text" name="email" placeholder="Su correo electrónico"></p>
            <p>Su teléfono: <br><input type="text" name="telefono" placeholder="Su teléfono"></p>
            <p>Asunto: <br><input type="text" name="asunto" placeholder="Asunto"></p>
            <p>Su mensaje: <br><textarea name="mensaje" placeholder="Su mensaje" rows="5" cols="40"></textarea></p>
            <p><small>0/500</small></p>
            
            <p><input type="submit" value="ENVIAR"></p>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Restaurante Sabor Tradicional - Elaborado por Jesus Lama</p>
</footer>

</body>
</html>
