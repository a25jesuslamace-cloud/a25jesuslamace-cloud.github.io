<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Jesus Lama">
    <meta name="description" content="Formulario de reseña de platos.">
    <meta name="keywords" content="resena, opiniones, plato, restaurante">
    <title>Reseña de un plato - Restaurante Sabor Tradicional</title>
</head>
<body>

<header>
    <h1>Restaurante Sabor Tradicional</h1>
</header>

<nav>
    <ul>
        <li><a href="index.html">Volver al Menú Principal del Restaurante</a></li>
        <li><a href="../index.html">Volver al Menú Principal del Proyecto</a></li>
    </ul>
</nav>

<main>
    <section>
        <h2>Formulario de reseña de un plato</h2>
        
        <form action="#" method="get">
            <p>
                Selecciona el plato:
                <select name="plato">
                    <option value="Tortilla de Patatas Tradicional">Tortilla de Patatas Tradicional</option>
                    <option value="Croquetas de Jamón Ibérico">Croquetas de Jamón Ibérico</option>
                    <option value="Tarta de Queso Cremosa">Tarta de Queso Cremosa</option>
                    <option value="Gazpacho Andaluz Fresco">Gazpacho Andaluz Fresco</option>
                </select>
            </p>
            <p>
                Nombre del que realiza la reseña:<br>
                <input type="text" name="nombre_autor">
            </p>
            <p>
                Reseña del plato:<br>
                <textarea name="resena" rows="4" cols="40"></textarea>
            </p>
            <p>
                <input type="submit" value="Enviar reseña">
            </p>
        </form>
    </section>
</main>

<footer>
    <p>© 2026 Restaurante Sabor Tradicional - Elaborado por Jesus Lama</p>
</footer>

</body>
</html>
